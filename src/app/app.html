<main class="page-shell">
  <header class="topbar">
    <a class="brand" href="/" aria-label="Taskboard home"><span class="brand-mark">T</span> taskboard</a>
    @if (token()) {
      <button class="text-button" type="button" (click)="logout()">Sign out</button>
    }
  </header>
  @if (!token()) {
    <app-login [submitting]="submitting()" [error]="error()" (submitted)="login($event)" />
  } @else {
    <app-task-list [tasks]="tasks()" [loading]="loading()" [error]="error()" [statusFilter]="statusFilter" (statusFilterChange)="setStatusFilter($event)" (advance)="advance($event)" />
  }
</main>
